{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="panel" style="max-width: 420px; margin: 60px auto;">
    <h1>Admin login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" autofocus required>
        <div style="margin-top: 20px;">
            <button type="submit">Continue</button>
        </div>
    </form>
    <p class="muted" style="margin-top: 20px; font-size: 12px;">
        After your password, a 6-digit code will be sent to the admin number via Signal.
    </p>
</div>
{% endblock %}
