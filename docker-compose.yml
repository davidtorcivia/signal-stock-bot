services:
  # Signal CLI REST API - handles Signal protocol
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-api
    restart: unless-stopped
    ports:
      # Loopback ONLY: the signal-cli REST API has no authentication —
      # bound to 0.0.0.0 it let anyone on the LAN send messages as the
      # bots' numbers and dump group/identity data. The stock-bot
      # container reaches it via the Docker network (signal-api:8080);
      # this binding exists purely for on-host debugging.
      - "127.0.0.1:8093:8080"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - MODE=json-rpc
      - LOG_LEVEL=debug
    volumes:
      - ./data/signal-cli:/home/.local/share/signal-cli
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Stock Bot - processes commands and fetches data
  stock-bot:
    build: .
    container_name: stock-bot
    restart: unless-stopped
    depends_on:
      signal-api:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # env_file passes values through literally — avoids docker-compose's
    # variable interpolation mangling secrets that contain '$' (e.g. bcrypt
    # hashes). `environment:` below only sets values that must be overridden
    # for the Docker network.
    env_file:
      - .env
    environment:
      - SIGNAL_API_URL=http://signal-api:8080
      - ADMIN_PASSWORD_HASH_PATH=/app/admin_password.hash
    ports:
      # ADMIN_BIND_HOST controls which interface the admin UI listens on.
      # Default 127.0.0.1 = loopback only. Set to 0.0.0.0 for LAN access
      # (or a specific LAN IP like 192.168.1.131 to limit to one interface).
      - "${ADMIN_BIND_HOST:-127.0.0.1}:5000:5000"
    volumes:
      - ./logs:/app/logs
      - /nvme-mirror/apps/signal-stock-bot/data:/app/data
      - ./admin_password.hash:/app/admin_password.hash:ro
      # WSB daily read: the bot writes static HTML + og:image PNGs here; the
      # host Caddy serves this dir (via the Cloudflare tunnel) at
      # sigil.disinfo.zone. In-container path must match WSB_STATIC_DIR.
      - /nvme-mirror/static/sigil:/static/sigil
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bot-network:
    driver: bridge

